name: "aws-auth-check"

# Temporary workflow to verify OIDC + role chaining into each environment account.
# Delete once the deployment workflows have been migrated and verified.
on:
  push:
    paths:
      - .github/workflows/aws-auth-check.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws_auth_check:
    name: aws_auth_check_${{ matrix.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment: [test, preprod, prod]

    steps:
      - name: AWS Shared Services Authentication
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: eu-west-2
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: shared-services-session
          role-chaining: "false"
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Shared services identity
        run: aws sts get-caller-identity

      - name: AWS Environment Authentication
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: eu-west-2
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: ${{ matrix.environment }}-auth-check
          role-chaining: "true"
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Environment account identity
        run: aws sts get-caller-identity

      - name: List S3 buckets
        run: aws s3 ls
