on:
  push:
    branches:
      - "develop"
    paths:
      - repos/exporter/**
  workflow_dispatch:

name: "exporter_test"

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: ./repos/exporter

jobs:
  exporter_to_deploy_to_test:
    name: "exporter_test"
    runs-on: ubuntu-latest
    env:
      WORKSPACE: test
    environment:
      name: test

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # 6.4.0
        with:
          node-version: 24.x

      - name: build
        run: |
          echo "Starting build"
          npm ci
          echo " ci finished"
          npm install -D @types/aws-lambda esbuild
          npm run build-atco-${{ env.WORKSPACE }}
          npm run build-handler-${{ env.WORKSPACE }}
          npm run build-zipper-${{ env.WORKSPACE }}
          npm run build-bastion-${{ env.WORKSPACE }}
          npm run build-table-${{ env.WORKSPACE }}

      - name: test
        run: |
          echo "Running tests"
          npm run test:ci

      - name: lint
        run: |
          echo "Linting"
          npm run lint

      - name: AWS Shared Services Authentication      # shared services, OIDC
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: eu-west-2
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: shared-services-session
          role-chaining: "false"
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: AWS Environment Authentication     # chained into the environments account
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}   
          role-session-name: ${{ github.job }}-deploy
          aws-region: eu-west-2
          role-chaining: "true"
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      - name: Update atco code checker
        uses: "./.github/workflows/templates/update_lambda"
        with:
          repo: exporter
          lambda: atco-code-checker
          environment: ${{ env.WORKSPACE }}

      - name: Update exporter lambda
        uses: "./.github/workflows/templates/update_lambda"
        with:
          repo: exporter
          lambda: exporter
          environment: ${{ env.WORKSPACE }}

      - name: Update zipper lambda
        uses: "./.github/workflows/templates/update_lambda"
        with:
          repo: exporter
          lambda: zipper
          environment: ${{ env.WORKSPACE }}

      - name: Update bastion terminator lambda
        uses: "./.github/workflows/templates/update_lambda"
        with:
          repo: exporter
          lambda: bastion-terminator
          environment: ${{ env.WORKSPACE }}

      - name: Update table rename lambda
        uses: "./.github/workflows/templates/update_lambda"
        with:
          repo: exporter
          lambda: table-rename
          environment: ${{ env.WORKSPACE }}
