on:
  push:
    branches:
      - "develop"
    paths:
      - repos/fdbt-netex-output/**
  workflow_dispatch:

name: "fdbt-netex-output_test"

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: ./repos/fdbt-netex-output

jobs:
  fdbt-netex-output_deploy_to_test:
    name: "fdbt-netex-output_test"
    runs-on: ubuntu-latest
    env:
      WORKSPACE: test
    environment:
      name: test

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3

      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: "3.14"

      - name: audit-netex-validator
        run: |
          pip install safety==3.6.2
          cd src/netex-validator
          safety check -r requirements.txt

      - name: AWS Shared Services Authentication      # shared services, OIDC
        uses: department-for-transport-BODS/create-data/.github/actions/aws-auth@main
        with:
          aws_role_to_assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role_session_name: shared-services-session
          aws_region: eu-west-2
          role_chaining: "false"

      - name: AWS Environment Authentication     # chained into the environments account
        uses: department-for-transport-BODS/create-data/.github/actions/aws-auth@main
        with:
          aws_role_to_assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}   
          role_session_name: ${{ github.job }}-deploy
          aws_region: eu-west-2
          role_chaining: "true"

      - name: Zipping code for netex validator
        run: |
          echo "Zipping..."
          cd src/netex-validator
          pip install --target=/home/runner/work/create-data/create-data/repos/fdbt-netex-output/src/netex-validator -r requirements.txt
          pwd
          ls        
          zip -r netex-validator.zip . -x /cloudformation-template-create-stack.json -x /serverless.yml   
          zip -sf netex-validator.zip

      - name: update-netex-validator
        run: |
          echo "Updating..."
          cd src/netex-validator        
          aws lambda update-function-code --function-name netex-validator-test-NetexValidator --zip-file fileb://netex-validator.zip

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # 6.4.0
        with:
          node-version: 24.x

      - name: build
        run: |
          echo "Starting build"
          npm ci
          echo " ci finished"
          npm run build

      - name: lint
        run: |
          echo "Linting"
          npm run lint

      - name: remove dev deps
        run: |
          npm prune --omit=dev

      - name: Zipping code for netex emailer
        run: |
          echo "Zipping..."
          mkdir .emailer-build
          cp -R package.json node_modules .emailer-build/
          mkdir .emailer-build/src
          cp -R .build/src/netex-emailer .build/src/data .emailer-build/src
          cd .emailer-build/
          npm pkg delete scripts.prepare
          zip -r netex-emailer.zip .

      - name: update-netex-emailer
        run: |
          echo "Updating....."
          cd .emailer-build/
          aws lambda update-function-code --function-name netex-output-service-test-NetexEmailer --zip-file fileb://netex-emailer.zip

      - name: Zipping code for netex convertor
        run: |
          echo "Zipping..."
          mkdir .convertor-build
          cp -R package.json node_modules .convertor-build/
          mkdir .convertor-build/src
          cp -R .build/src/netex-convertor .build/src/data .build/src/types .convertor-build/src
          cp src/netex-convertor/period-tickets/periodTicketNetexTemplate.xml .convertor-build/src/netex-convertor/period-tickets
          cp src/netex-convertor/point-to-point-tickets/pointToPointTicketNetexTemplate.xml .convertor-build/src/netex-convertor/point-to-point-tickets
          cd .convertor-build/
          npm pkg delete scripts.prepare
          zip -r netex-convertor.zip .

      - name: update-netex-convertor
        run: |
          echo "Updating....."
          cd .convertor-build/
          aws lambda update-function-code --function-name netex-output-service-test-NetexConvertor --zip-file fileb://netex-convertor.zip
