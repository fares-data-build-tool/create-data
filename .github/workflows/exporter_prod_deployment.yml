on:
  push:
    tags:
    - 'v*'
    paths:
    - repos/exporter/**
  workflow_dispatch:

name: 'exporter_prod'

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: ./repos/exporter

jobs:

  exporter_to_deploy_to_prod:
    name: 'exporter_to_deploy_to_prod'
    runs-on: ubuntu-latest
    env:
      WORKSPACE: prod
    environment:
      name: prod
    
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3

    - name: Use Node.js 
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # 6.4.0
      with:
        node-version: 24.x
    
    - name: build
      run: |
        echo "Starting build"
        npm ci
        echo " ci finished"
        npm install -D @types/aws-lambda esbuild
        npm run build-atco-${{ env.WORKSPACE }}
        npm run build-handler-${{ env.WORKSPACE }}
        npm run build-zipper-${{ env.WORKSPACE }}
        npm run build-bastion-${{ env.WORKSPACE }}
        npm run build-table-${{ env.WORKSPACE }}

    - name: test
      run: |
        echo "Running tests"
        npm run test:ci

    - name: lint
      run: |
        echo "Linting"
        npm run lint

    - name: AWS Shared Services Authentication      # shared services, OIDC
      uses: department-for-transport-BODS/create-data/.github/actions/aws-auth@main
      with:
        aws_role_to_assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        role_session_name: shared-services-session
        aws_region: eu-west-2
        role_chaining: "false"

    - name: AWS Environment Authentication     # chained into the environments account
      uses: department-for-transport-BODS/create-data/.github/actions/aws-auth@main
      with:
        aws_role_to_assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}   
        role_session_name: ${{ github.job }}-deploy
        aws_region: eu-west-2
        role_chaining: "true"

    - name: Update atco code checker
      uses: "./.github/workflows/templates/update_lambda"
      with:
        repo: exporter
        lambda: atco-code-checker
        environment: ${{ env.WORKSPACE }}

    - name: Update exporter lambda
      uses: "./.github/workflows/templates/update_lambda"
      with:
        repo: exporter
        lambda: exporter
        environment: ${{ env.WORKSPACE }}

    - name: Update zipper lambda
      uses: "./.github/workflows/templates/update_lambda"
      with:
        repo: exporter
        lambda: zipper
        environment: ${{ env.WORKSPACE }}

    - name: Update bastion terminator lambda
      uses: "./.github/workflows/templates/update_lambda"
      with:
        repo: exporter
        lambda: bastion-terminator
        environment: ${{ env.WORKSPACE }}

    - name: Update table rename lambda
      uses: "./.github/workflows/templates/update_lambda"
      with:
        repo: exporter
        lambda: table-rename
        environment: ${{ env.WORKSPACE }}
