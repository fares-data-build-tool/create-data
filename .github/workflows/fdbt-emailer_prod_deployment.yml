on:
  push:
    tags:
      - 'v*'
    paths:
      - repos/fdbt-emailer/**
  workflow_dispatch:

name: "fdbt-emailer-prod"

defaults:
  run:
    working-directory: ./repos/fdbt-emailer

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WORKSPACE: prod
    environment:
      name: prod

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # 6.4.0
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build-all-functions-${{ env.WORKSPACE }}

      - name: AWS Shared Services Authentication      # shared services, OIDC
        uses: ./.github/actions/aws-auth
        with:
          aws_role_to_assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role_session_name: shared-services-session
          aws_region: eu-west-2
          role_chaining: "false"

      - name: AWS Environment Authentication     # chained into the environments account
        uses: ./.github/actions/aws-auth
        with:
          aws_role_to_assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}   
          role_session_name: ${{ github.job }}-deploy
          aws_region: eu-west-2
          role_chaining: "true"

      - name: Update multi-operator-action-required-emailer lambda
        uses: "./.github/workflows/templates/update_lambda"
        with:
          repo: fdbt-emailer
          lambda: fdbt-multi-operator-action-required-emailer
          environment: ${{ env.WORKSPACE }}

      - name: Update multi-operator-product-complete-emailer lambda
        uses: "./.github/workflows/templates/update_lambda"
        with:
          repo: fdbt-emailer
          lambda: fdbt-multi-operator-product-complete-emailer
          environment: ${{ env.WORKSPACE }}
